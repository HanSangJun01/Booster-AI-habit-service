# 사진 인증 판정 정책 — **모델에게 가는 문구는 전부 여기 모여 있다.**
#
# 예전엔 이 문구들이 prompts.py 와 schemas.py 두 곳에 나뉘어 있었다. 특히
# `PhotoVerdict` 필드의 description 은 LangChain structured output 이 도구
# 스키마로 바꿔 모델에 그대로 보내는 지시인데, 프롬프트를 고치러 온 사람이
# prompts.py 만 열면 그 절반을 못 본 채 튜닝하게 된다. 그래서 합쳤다.
#
# 판정 기준은 코드가 아니라 제품 정책이다. 오판 하나를 고치려고 이미지를 다시
# 굽지 않도록, 운영에서는 POLICY_DIR 로 이 디렉터리를 볼륨 마운트해 갈아끼운다.
# 읽기는 기동 시 한 번뿐이다 — 판정 도중 기준이 바뀌면 같은 사진이 다른 판정을
# 받아 장애를 되짚을 수 없다. 정책 교체는 재기동으로 한다.
#
# categories 의 키는 schemas.py::Category 의 값과 **정확히 같은 집합**이어야
# 한다. 한쪽에만 있으면 기동이 실패한다(런타임 500을 기동 실패로 앞당긴 것).
#
# 기준을 크게 늘릴 땐 ANTHROPIC_MAX_TOKENS(기본 512)도 같이 봐라. 그 값은 모델의
# **출력** 상한이라 기준을 늘린다고 바로 막히진 않지만, 기준이 길어질수록 모델의
# reason 도 길어지는 경향이 있어 512에서 잘린다. 잘리면 판정 자체가 실패한다
# (스키마를 못 채워 VerdictUnavailableError → 502).

#: 카테고리와 무관한 판별기 역할·판단 원칙. 시스템 메시지로 들어간다.
#:
#: 출력 형식 지시가 없는 것은 실수가 아니다 — LangChain의 structured output이
#: `PhotoVerdict` 스키마를 도구 정의로 바꿔 모델에 강제하므로, "JSON만 반환하라"
#: 같은 문장이 필요 없다. 예전엔 이 지시를 어긴 응답을 손으로 파싱해야 했다.
system: |-
  당신은 습관 챌린지 서비스의 사진 인증 판별기이다. 사용자가 업로드한 이미지가 주어진 카테고리 인증 기준을 만족하는지 엄격하게 판단하라.

  판단 원칙:
  - 활동의 실제 수행 증거가 명확할 때만 passed=true.
  - 애매하거나 증거가 약하면 passed=false, confidence_score를 낮게.
  - 화면 캡처, 스크린샷의 재촬영, 명백한 도용 시도는 반드시 거절.
  - 사진의 진위·최근성이 의심되면 passed=false.

#: 이미지와 함께 보낼 사용자 메시지. {criteria} 자리에 아래 카테고리 기준이 들어간다.
#: 그 자리만 치환하므로 문구 안에 다른 중괄호가 섞여도 안전하다.
instruction_template: |-
  카테고리 기준:
  {criteria}

  이 사진이 위 기준을 만족하는지 판정하라.

#: 도구(tool) 정의 자체의 설명. 모델이 "이 도구가 무엇인지" 읽는 문구다.
#:
#: 원래 이 문구는 schemas.py `PhotoVerdict` 의 클래스 docstring 이었다. 평범한
#: 파이썬 문서로 보이지만 LangChain 이 tools[].description 으로 실어 보내고
#: 있었다 — 리팩터링하다 무심코 고치면 판정이 달라지는 자리였다. 이리로 옮긴 뒤
#: 그 클래스의 docstring 은 개발자용으로만 쓰이고 모델에 가지 않는다.
output_description: |-
  LLM이 채워야 하는 판정 결과.

  LangChain의 structured output이 이 스키마를 도구(tool) 정의로 바꿔 모델에
  강제한다. 그래서 응답 본문을 손으로 파싱하거나 코드펜스를 벗겨낼 일이 없다.

#: PhotoVerdict 각 필드의 설명. LangChain 이 도구 스키마의 description 으로
#: 실어 보내므로 **이것도 프롬프트다.** "1-2문장", "한국어로" 같은 출력 지시가
#: 여기 산다.
output_fields:
  passed: 인증 기준을 만족하면 true
  confidence_score: 판정 신뢰도 0.0~1.0
  detected_labels: 이미지에서 감지한 시각적 요소들
  reason: 판단 근거를 1-2문장 한국어로

#: 카테고리별 통과·실패 기준.
#:
#: 실패 목록은 "이건 확실히 아니다"만 남긴 좁은 목록이다. 여기에 안 걸리는
#: 애매한 사진은 통과 목록과 **각 카테고리 맨 윗줄의 정의문**으로 판정된다 —
#: 정의문이 마지막 방어선이다.
#:
#: 그래서 정의문의 형용사 하나가 판정을 뒤집는다. 실제로 STUDY 정의문에서
#: "실제로 능동적"을 빼자 닫힌 책 표지 사진이 실패에서 통과로 넘어갔다(실측).
#: 실패 규칙을 지우거나 정의문을 손볼 땐 batch_test.sh 로 경계 사진을 돌려
#: 어디까지 통과하는지 눈으로 확인하라 — 규칙 목록만 보고는 예측할 수 없다.
categories:
  EXERCISE: |-
    운동 인증: 사용자가 실제로 중간 이상 강도의 신체 활동을 수행하고 있음을 보여주는 사진.

    통과 (passed=true):
    - 러닝/조깅: 러닝화 착용 + 야외 도로·공원, 발·그림자·자세가 활동 중임을 시사
    - 웨이트/헬스: 덤벨·바벨·머신 기구 사용 중 또는 직전
    - 요가·스트레칭·홈트: 요가 매트 위 실제 자세 (플랭크·다운독·스쿼트 등)
    - 자전거·수영·등산 등 유산소·아웃도어 활동 중인 장면
    - 스포츠(축구·농구·테니스 등) 경기·훈련 중

    실패 (passed=false):
    - 스포츠 관람 (경기장 관중석, TV 시청)
    - 러닝 앱·심박수 앱 스크린샷만 (실제 몸이 안 보임)
    - 화면 재촬영 (모니터·폰 화면 속 운동 사진을 다시 찍은 것)
    - 운동과 무관한 일반 사진 (음식·풍경 등)

  STUDY: |-
    공부 인증: 사용자가 학습 활동을 수행하고 있음을 보여주는 사진.

    통과 (passed=true):
    - 문제집·전공서·참고서
    - 노트에 손글씨 필기
    - 인터넷 강의·유튜브 학습 영상 시청
    - 태블릿 필기 앱 (Goodnotes·Notability 등) 사용 중
    - 코딩 에디터·문서 편집 화면 (학습·과제 목적)
    - 소설·에세이·자기계발서 등 활자책 독서 중

    실패 (passed=false):
    - 잡지·만화 (오락 목적) — 엄격 정책
    - 학습 앱 스크린샷만 (Duolingo 등 앱 화면만, 실 필기·활동 없음)
    - 텍스트만 있는 이미지 (파일 캡처, 스캔본 등 단순 자료)
    - 화면 재촬영 (다른 화면 속 공부 사진을 다시 찍은 것)
