# [멀티서버 입증] nginx 로드밸런서
# backend-1/2/3 을 라운드로빈으로 분산. docker-compose.multi.yml 이 이 파일을 마운트한다.
# 요청(HTTP)만 분산됨 — @Scheduled 스케줄러는 각 인스턴스가 독립 실행됨(정합성 함정, 3단계에서 재현).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;                 # 부하테스트 노이즈·디스크 IO 제거
    upstream booster_backend {
        # 기본 라운드로빈. keepalive 로 업스트림 커넥션 재사용(핸드셰이크 비용 절감).
        server backend-1:8080 max_fails=3 fail_timeout=5s;
        server backend-2:8080 max_fails=3 fail_timeout=5s;
        server backend-3:8080 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8080;

        # LB 자체 헬스체크용
        location = /lb-health {
            return 200 "nginx-lb ok\n";
        }

        location / {
            proxy_pass http://booster_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";        # keepalive 유지
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 어느 인스턴스가 응답했는지 추적(캐시 불일치·분산 관측용)
            add_header X-Upstream $upstream_addr always;
        }
    }
}
