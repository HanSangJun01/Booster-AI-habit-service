# [멀티서버 입증] Prometheus 수집 설정 — 인스턴스 3대를 개별 scrape
# 단일서버용 prometheus.yml 은 host.docker.internal:8080 을 봤지만,
# 멀티에서는 백엔드가 컨테이너로 돌므로 같은 도커 네트워크의 서비스명으로 직접 긁는다.
# instance 라벨로 인스턴스별 부하 분산/커넥션풀을 Grafana에서 구분해 볼 수 있다.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'booster-backend-multi'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-1:8080']
        labels: { instance_name: 'backend-1' }
      - targets: ['backend-2:8080']
        labels: { instance_name: 'backend-2' }
      - targets: ['backend-3:8080']
        labels: { instance_name: 'backend-3' }
