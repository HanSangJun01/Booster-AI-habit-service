# [BS-30 모니터링 스택] Prometheus + Grafana (자동 프로비저닝)
# 실행:  docker compose -f docker-compose.monitoring.yml up -d
# 종료:  docker compose -f docker-compose.monitoring.yml down
#   - Grafana:    http://localhost:3000  (admin / admin)  → A축 대시보드 자동 로딩됨
#   - Prometheus: http://localhost:9090
# 백엔드는 별도로 호스트에서 실행: ./gradlew bootRun  (8080)
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: booster-a-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      # 리눅스 환경에서도 host.docker.internal 이 호스트를 가리키도록 (Docker Desktop은 기본 지원)
      - "host.docker.internal:host-gateway"

  # [버그 관측] DB 상태를 지표로 노출한다. 애플리케이션은 건드리지 않는다.
  # 이번 결함들(반경 상한 부재 / 구제 만료 이중 처벌 / 정합성)은 HTTP 계층에 흔적이 없고
  # '남은 데이터'로만 드러나므로, actuator 대신 DB 를 직접 센다.
  # 쿼리 정의: monitoring/postgres-exporter/queries.yaml
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: booster-a-pg-exporter
    ports:
      - "9187:9187"
    environment:
      # booster-db 는 별도 compose(docker-compose.yml)에서 5432 를 publish 한다 → 호스트 경유.
      DATA_SOURCE_NAME: "postgresql://booster:booster@host.docker.internal:5432/booster?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/pg_exporter/queries.yaml"
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/pg_exporter/queries.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: booster-a-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      # 데이터소스 + 대시보드 provider 설정 (시작 시 자동 등록)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # 실제 대시보드 json 들 (provider가 이 경로를 읽음)
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
