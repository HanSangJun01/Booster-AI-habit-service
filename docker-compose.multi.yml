# [멀티서버 필요성 입증] nginx LB + 백엔드 3대 + db + Prometheus/Grafana 올인원 스택
# 실행:  docker compose -f docker-compose.multi.yml up -d --build
# 종료:  docker compose -f docker-compose.multi.yml down
#   - 앱(LB):      http://localhost:8080   (nginx → backend-1/2/3 라운드로빈)
#   - Grafana:     http://localhost:3000   (admin/admin)
#   - Prometheus:  http://localhost:9090   (인스턴스별 instance_name 라벨)
#
# 커넥션 제약(중요): 인스턴스당 pool=30 × 3대 = 90 ≤ postgres max_connections(기본 100).
#   → 4대(120)로 늘리면 DB 커넥션 고갈. 수평 확장이 병목을 '앱 풀'에서 'DB 커넥션'으로
#     옮긴다는 증거. 더 늘리려면 per-instance pool 축소 또는 PgBouncer 도입 필요.

x-backend: &backend
  build: ./backend
  image: booster-backend:multi        # 3대가 동일 이미지 재사용(빌드 1회)
  depends_on:
    db:
      condition: service_healthy
  environment:
    DB_URL: jdbc:postgresql://db:5432/booster
    DB_USERNAME: booster
    DB_PASSWORD: booster
    DB_POOL_MAX: "30"                 # pool × 인스턴스 ≤ max_connections(100) 유지
    DB_POOL_MIN_IDLE: "10"
    JWT_SECRET: booster-local-dev-secret-key-please-change-in-production-0123456789
  expose:
    - "8080"                          # 호스트에 직접 노출 안 함 — nginx만 8080 공개
  restart: unless-stopped

services:
  db:
    image: postgres:16
    container_name: booster-multi-db
    environment:
      POSTGRES_DB: booster
      POSTGRES_USER: booster
      POSTGRES_PASSWORD: booster
    # max_connections 기본 100 유지 — pool×인스턴스 천장을 관측 가능하게 둠
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booster -d booster"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-1:
    <<: *backend
    container_name: booster-backend-1
    # 싱글서버 기준선 측정용 직결 포트(8081). 멀티 비교는 nginx(8080)를 통해 3대 분산.
    # 이렇게 하면 싱글/멀티 둘 다 동일한 Docker 환경에서 재어 비교가 오염되지 않는다.
    ports:
      - "8081:8080"
  backend-2:
    <<: *backend
    container_name: booster-backend-2
  backend-3:
    <<: *backend
    container_name: booster-backend-3

  nginx:
    image: nginx:latest
    container_name: booster-multi-nginx
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  prometheus:
    image: prom/prometheus:latest
    container_name: booster-multi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-multi.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: booster-multi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
